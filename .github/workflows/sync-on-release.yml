# Fires on every GitHub Release published in THIS repo (agent-instructions), one per
# CONTRACT_VERSION bump — preserves the "deliberate cut" semantics: no push-triggered
# propagation of an unfinished edit.
#
# ── ONE-TIME SETUP REQUIRED BEFORE THIS WORKFLOW CAN RUN (org-admin action, cannot be
#    scripted — do this in the GitHub UI) ──────────────────────────────────────────────
# 1. github.com -> Settings -> Developer settings -> GitHub Apps -> New GitHub App
#      - Repository permissions: Contents (Read & write), Pull requests (Read & write)
#      - Install on the `solid-stats` organization, scoped to the repos in
#        config/repositories.tsv (or "all repositories")
# 2. Add two repo secrets on solid-stats/agent-instructions:
#      AGENT_INSTRUCTIONS_APP_ID           — the App's numeric ID
#      AGENT_INSTRUCTIONS_APP_PRIVATE_KEY  — the App's generated .pem private key, full contents
# Until both secrets exist this workflow will fail at the "mint app token" step. That is
# expected — it is scaffolded, not yet wired.
# ─────────────────────────────────────────────────────────────────────────────────────

name: Sync agent instructions on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-instructions
        uses: actions/checkout@v4

      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AGENT_INSTRUCTIONS_APP_ID }}
          private-key: ${{ secrets.AGENT_INSTRUCTIONS_APP_PRIVATE_KEY }}
          owner: solid-stats

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read CONTRACT_VERSION
        id: contract
        run: echo "version=$(cat CONTRACT_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Sync every repo in the manifest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTRACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          branch="agent-instructions-sync-v${CONTRACT_VERSION}"

          tail -n +2 config/repositories.tsv | while IFS=$'\t' read -r repo tier gsd_sync; do
            [ -z "$repo" ] && continue
            echo "::group::$repo"

            workdir=$(mktemp -d)
            gh repo clone "$repo" "$workdir" -- --depth 1
            cd "$workdir"

            git checkout -b "$branch"

            sh "$GITHUB_WORKSPACE/scripts/install-bridge.sh" --root .

            if [ "$gsd_sync" = "yes" ] && [ -f .planning/config.json ]; then
              node "$GITHUB_WORKSPACE/scripts/sync-gsd-config.mjs" .
            fi

            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "agent-instructions-bot"
              git config user.email "agent-instructions-bot@users.noreply.github.com"
              git add -A
              git commit -m "chore(agent-instructions): sync to CONTRACT_VERSION ${CONTRACT_VERSION}"
              git push -u origin "$branch" --force
              gh pr create \
                --repo "$repo" \
                --title "chore(agent-instructions): sync to CONTRACT_VERSION ${CONTRACT_VERSION}" \
                --body "Automated sync from [solid-stats/agent-instructions](https://github.com/solid-stats/agent-instructions) at CONTRACT_VERSION ${CONTRACT_VERSION}. Review the diff before merging — this never auto-merges." \
                --head "$branch" \
                || echo "PR already open for $repo, updated the branch instead."
            else
              echo "$repo already current, nothing to sync."
            fi

            cd "$GITHUB_WORKSPACE"
            rm -rf "$workdir"
            echo "::endgroup::"
          done
